<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>茶博士 · 茶馆小当家</title>
<style>
:root{--bg:#121c14;--card:#e8e4c9;--ink:#26331f;--red:#9a3b24;--gold:#c9b45a;--jade:#7fd6a0;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#eee9cf;font-family:"Songti SC","Noto Serif SC",serif}
#app{max-width:480px;margin:0 auto;padding:10px 12px 24px;min-height:100%}
.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #3b5a3f;padding-bottom:8px;margin-bottom:10px}
.top b{font-size:20px;color:var(--gold)}.top small{opacity:.85}
.bar{height:8px;background:#26382a;border-radius:4px;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:var(--jade)}
.news{background:#1c2c20;border-left:3px solid var(--gold);padding:8px;font-size:14px;margin:8px 0}
.door{display:block;width:100%;margin:10px 0;padding:14px;background:linear-gradient(#27422d,#182a1c);border:2px solid var(--gold);border-radius:14px;color:#eee9cf;font:inherit;font-size:18px;text-align:center}
.door small{display:block;opacity:.7;font-size:13px;margin-top:2px}
.card{background:var(--card);color:var(--ink);border-radius:8px;padding:12px;margin:10px 0}
.card h3{margin:0 0 6px;text-align:center;letter-spacing:4px}.sym{font-size:17px;line-height:1.6}
.btn{display:block;width:100%;padding:12px;margin:8px 0;background:var(--red);border:2px solid var(--gold);border-radius:8px;color:#fff;font:inherit;font-size:17px}.btn.alt{background:#27422d}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g2{grid-template-columns:repeat(2,1fr)}
.dr{background:linear-gradient(#5e8a53,#3e6339);border:1px solid #2a4527;border-radius:8px;color:#f4f1d6;font:inherit;font-size:16px;padding:14px 4px;text-align:center}
.dr.bad{background:#7a2a20}.dr.ok{background:#b79a2d;color:#1a1a0a}
.bigbar{height:26px;background:#cfd0a8;border-radius:13px;position:relative;margin:16px 0 6px;overflow:hidden}.bigbar i{position:absolute;left:0;top:0;bottom:0;background:#6a9e58}.bigbar em{position:absolute;top:0;bottom:0;background:rgba(201,180,90,.7)}
.cn{font-size:12px;opacity:.7}.msg{text-align:center;min-height:22px;color:var(--gold)}
</style><style>.collection-nav{position:relative;z-index:3;max-width:560px;margin:0 auto;padding:12px 16px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;font:13px system-ui,sans-serif}.collection-nav a{color:var(--gold);text-decoration:none;border:1px solid var(--gold);padding:9px 12px;border-radius:9px;display:inline-flex;align-items:center;min-height:40px}.collection-nav span{opacity:.7}.collection-cover{height:104px;max-width:528px;margin:10px auto 0;border-radius:12px;background-position:center;background-size:cover;opacity:.9}.collection-nav a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}button{cursor:pointer}#app{min-height:0} @media(max-width:560px){.collection-cover{margin-left:16px;margin-right:16px;height:90px}} @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}</style></head><body><nav class="collection-nav"><a href="../">← 返回游戏大厅</a><span>游戏进度保存在本机</span></nav><div class="collection-cover" aria-hidden="true" style="background-image:url(../assets/tea.svg)"></div><div id="app"></div>
<script>
const T=[["西湖龙井","绿茶","浙江杭州","豆香清鲜",80,30,"清热提神，春日明前最珍"],["碧螺春","绿茶","江苏苏州洞庭","花果香",80,30,"卷曲如螺，生津止渴"],["白毫银针","白茶","福建福鼎","毫香清甜",90,40,"满披白毫，性凉清热"],["君山银针","黄茶","湖南岳阳君山","甜香醇和",80,40,"冲泡时芽头直立起落"],["铁观音","青茶","福建安溪","兰花香",95,30,"七泡有余香，提神消食"],["大红袍","青茶","福建武夷山","岩韵花果香",100,25,"岩茶之王，醇厚回甘"],["凤凰单丛","青茶","广东潮州","蜜兰香",95,25,"天然花蜜香，耐泡"],["正山小种","红茶","福建桐木关","松烟香",90,30,"红茶始祖，温胃暖身"],["祁门红茶","红茶","安徽祁门","蜜糖香",90,30,"祁门香，醇和鲜甜"],["普洱熟茶","黑茶","云南","陈香醇厚",100,20,"渥堆发酵，消食解腻"],["六堡茶","黑茶","广西梧州","槟榔香",100,20,"陈醇，祛湿"],["茉莉花茶","花茶","福建福州","花香鲜灵",85,30,"茶坯窨花而成，理气解郁"],["黄山毛峰","绿茶","安徽黄山","清香高爽",80,30,"形似雀舌，白毫显露"],["白牡丹","白茶","福建政和","毫香花香",90,40,"一芽二叶，清热润肺"],["普洱生茶","黑茶","云南","清香苦涩回甘",95,25,"越陈越香，耐泡"],["武夷肉桂","青茶","福建武夷山","桂皮香",100,25,"辛香浓烈，岩骨花香"]];
const CAT=["绿茶","白茶","黄茶","青茶","红茶","黑茶","花茶"];
const C=[[0,"想来杯杭州的明前绿茶，豆香清鲜，汤色嫩绿。"],[1,"要苏州洞庭的茶，花果香，茶叶卷曲如螺。"],[4,"想喝兰花香的乌龙，安溪来的，七泡有余香。"],[5,"武夷岩茶，要有岩韵，味醇厚回甘。"],[7,"要松烟香的红茶，福建桐木关的。"],[8,"想喝蜜糖香的红茶，安徽祁门。"],[9,"吃多了油腻，想喝陈香醇厚的云南熟茶消食。"],[2,"想喝毫香清甜、满披白毫的白茶。"],[3,"湖南君山来的黄茶，芽头冲泡时直立起落。"],[11,"想喝花香鲜灵的花茶，茉莉窨制的。"],[6,"要潮州的，蜜兰香，一股天然花蜜味。"],[10,"想喝广西的黑茶，槟榔香，陈醇。"]];
const GU=["张老爷","林夫人","陈书生","赵掌柜","周小姐","吴将军","郑秀才","孙老太"];
const tf=n=>T.find(x=>x[0]===n);
const CD={绿茶:"不发酵，杀青保住叶绿素，清鲜",白茶:"微发酵，自然萎凋干燥，毫香清甜",黄茶:"轻发酵，有‘闷黄’工序，甜醇柔和",青茶:"半发酵，经摇青做青，花果香或岩韵",红茶:"全发酵，叶红汤红，甜香醇厚",黑茶:"后发酵，渥堆陈化，陈香醇厚",花茶:"茶坯窨花，花香鲜灵"};
const TD={
西湖龙井:["杀青后在锅中用‘抓、抖、搭、拓、捺、推、扣、甩、磨、压’等手法炒制，扁平光滑。","相传乾隆下江南，在狮峰山下品茶，把茶叶藏入袖中带回宫，后封十八棵御茶树。","汤色嫩绿明亮，豆香清鲜，滋味甘醇。","水温别太高，用玻璃杯投茶，看叶片舒展。"],
碧螺春:["杀青、揉捻、搓团显毫、烘干，条索卷曲如螺，满披白毫。","相传原名‘吓煞人香’，康熙南巡尝后赐名‘碧螺春’。","汤色嫩绿清澈，花果香馥郁，鲜爽生津。","可用‘上投法’：先倒水再投茶，看茶叶徐徐下沉。"],
白毫银针:["只采单芽，经萎凋、干燥，不炒不揉，自然风干。","白茶有‘一年茶、三年药、七年宝’的说法，越陈越有药香。","汤色杏黄清亮，毫香蜜韵，滋味清甜。","新茶清鲜，老茶药香，水温可略高，焖泡更醇。"],
君山银针:["黄茶特有的‘闷黄’工序，让茶芽慢慢转黄。","传说文成公主入藏带了君山茶；冲泡时芽尖朝上、三起三落，如群笋出土。","汤色杏黄明亮，甜香醇和，回味柔和。","用玻璃杯，水温别过高，可欣赏芽头三起三落。"],
铁观音:["半发酵，经晒青、摇青、杀青、包揉、烘焙，颗粒紧结如蜻蜓头。","相传安溪茶农魏荫梦中得观音指引发现此茶，茶色如铁、貌若观音，故名铁观音。","汤色金黄明亮，兰花香，入口醇厚回甘，有‘观音韵’。","用盖碗高温快冲，二三泡最香，七泡有余香。"],
大红袍:["武夷岩茶，做青后经‘炭焙’，焙火赋予岩韵。","传说明代一位举子患病，饮武夷山茶痊愈，高中状元后以红袍披在茶树上，故称大红袍。","汤色橙黄，花果香带焙火香，岩韵十足，耐泡。","用紫砂壶或盖碗，沸水快出汤。"],
凤凰单丛:["单株采摘，摇青、杀青后烘干，可分蜜兰香、芝兰香等香型。","产于潮州凤凰山，有‘宋种’古茶树，每株自成一味，故称‘单丛’。","汤色橙黄清澈，花蜜香浓，韵味悠长。","小壶盖碗高温快出汤，后几泡蜜香更明显。"],
正山小种:["萎凋、揉捻、发酵，再用松柴明火烘干，染上松烟香。","相传明末兵扰桐木关，茶农来不及晒茶，只好用松木烘干，却成就了世界红茶的鼻祖。","汤色红艳，松烟香，桂圆味，滋味醇厚。","可清饮也可加奶，水温约90℃。"],
祁门红茶:["揉切、发酵，条索紧细，香气持久。","光绪年间创制，与大吉岭、乌瓦并称世界三大高香红茶。","汤色红艳明亮，蜜糖香，鲜甜柔和。","适合清饮，也适合配牛奶。"],
普洱熟茶:["晒青毛茶经‘渥堆’人工后发酵，约四十余天，让茶变得红浓陈香。","因集散地普洱府得名，古时经茶马古道驮运入藏。","汤色红浓明亮，陈香醇厚，滑口。","用沸水先洗茶一次再泡；适合饭后。"],
六堡茶:["渥堆发酵后蒸压入篓，常存放陈化。","产于广西苍梧六堡镇，有‘侨销茶’之称，南洋矿工常用它祛湿。","汤色红浓，槟榔香，陈醇顺滑。","用沸水，也可煮饮；存放越久越醇。"],
茉莉花茶:["茶坯与茉莉鲜花多次‘窨制’，反复吐香吸香。","福州茉莉花茶窨制技艺已有千年，常被誉为‘人间第一香’。","汤色黄绿明亮，花香鲜灵持久，鲜爽甘甜。","用盖碗，水温别过高，先闻香再品。"],
黄山毛峰:["杀青、揉捻、烘焙，形似雀舌，白毫显露，色似象牙。","清光绪年间谢裕大茶庄创制，产自黄山，常与云雾为伴。","汤色清碧微黄，清香高爽，滋味鲜醇。","用玻璃杯，水温约80℃，鲜爽回甘。"],
白牡丹:["采一芽二叶，萎凋干燥，叶态舒展如牡丹。","产自福建政和、建阳，冲泡时绿叶托银芽，宛如牡丹绽放，故名白牡丹。","汤色杏黄，毫香花香，滋味鲜醇。","水温可略高，三五泡后更甜。"],
普洱生茶:["晒青毛茶蒸压成饼，自然陈化，不经渥堆。","古树茶讲究树龄，越老越珍贵；饼茶七片为一筒，称‘七子饼’。","汤色黄绿，清香，苦涩回甘，生津。","新茶宜稍低水温，老生茶可用沸水。"],
武夷肉桂:["半发酵，炭焙，焙火后产生桂皮辛香。","原名‘玉桂’，因香似肉桂而得名，是武夷岩茶中的‘香王’。","汤色橙红，桂皮香，辛爽浓郁，岩骨花香。","可用沸水，每泡间隔略长，防止过苦。"]};
const NEWS=["今日茶馆来了不少客人。","春茶刚上市，新茶价高。","梅雨天，茶叶要防潮。","茶博士说：水温不对，茶就不对。"];
const S0=()=>({day:1,max:30,mo:1,coin:100,rep:0,hp:10}),rank=()=>S.rep>=20?"茶圣":S.rep>=10?"茶博士":S.rep>=4?"茶艺师":"茶童";
let S=S0(),K={},cs=null,raf=0;
try{const v=JSON.parse(localStorage.getItem("tea")||"{}");if(v.S)S=v.S;if(v.K)K=v.K}catch(e){}
function save(){try{localStorage.setItem("tea",JSON.stringify({S,K}));const rk="collection.record.tea",r=JSON.parse(localStorage.getItem(rk)||"{}");r.bestRep=Math.max(r.bestRep||0,S.rep);r.months=r.months||0;localStorage.setItem(rk,JSON.stringify(r))}catch(e){}}
const $=id=>document.getElementById(id),R=a=>a[Math.floor(Math.random()*a.length)],sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const nK=()=>Object.keys(K).length;
function hdr(){return `<div class="top"><div><b>${rank()}小当家</b><div class="cn">第${S.mo}月 · 第${S.day}天 / 共${S.max}天</div></div><small>铜钱 ${S.coin}<br>名望 ${S.rep}</small></div>`}
function stopL(){cancelAnimationFrame(raf)}
function use(){S.day++;S.hp=Math.max(0,S.hp-1)}
function hub(){stopL();if(S.hp<=0){S.hp=4;S.day++}save();if(S.day>S.max)return end();
$("app").innerHTML=hdr()+`<div class="news">茶馆：${R(NEWS.concat(Object.values(TD).map(x=>"茶话："+x[1])))}</div><div class="cn">体力</div><div class="bar"><i style="width:${S.hp*10}%"></i></div>
<button class="door" onclick="serve()">前堂 · 待客<small>听客人所需，选茶、冲泡</small></button>
<button class="door" onclick="tq()">茶库 · 识茶<small>凭产地香气认茶</small></button>
<button class="door" onclick="cq()">书房 · 茶经<small>六大茶类，辨别归属</small></button>
<button class="door" onclick="dict()">茶典<small>已学 ${nK()}/${T.length} 款茶：产地、香气、水温、时间</small></button>
<button class="door" onclick="S.hp=Math.min(10,S.hp+4);S.day++;hub()">歇着<small>恢复体力，过一天</small></button>`}
function end(){stopL();try{const k="collection.record.tea";const old=JSON.parse(localStorage.getItem(k)||"{}");localStorage.setItem(k,JSON.stringify({bestRep:Math.max(old.bestRep||0,S.rep),months:Math.max(old.months||0,S.mo||1)}))}catch(e){}const t=S.rep>=20?"茶圣":S.rep>=10?"茶博士":S.rep>=4?"茶艺师":"茶童";
$("app").innerHTML=hdr()+`<div class="card"><h3>月终 · 结算</h3><p class="sym" style="text-align:center">铜钱 ${S.coin}<br>名望 ${S.rep}<br>称号：<b style="color:#9a3b24">${t}</b></p></div><button class="btn" onclick="S.day=1;S.hp=10;S.mo++;hub()">继续经营 · 下一月</button><button class="btn alt" onclick="S=S0();hub()">重新开始</button>`}
/* serve */
function serve(){const n=Math.min(C.length,5+Math.floor(S.rep/2)),c=R(C.slice(0,n)),t=T[c[0]];
const same=sh(T.filter(x=>x!==t&&x[1]===t[1])),rest=sh(T.filter(x=>x!==t&&x[1]!==t[1]));
cs={c,t,g:R(GU),o:sh([t,...same.slice(0,1),...rest].slice(0,4).concat(0).slice(0,4))};
if(!cs.o.includes(t))cs.o[0]=t;cs.o=sh(cs.o);
$("app").innerHTML=hdr()+`<div class="card"><h3>${cs.g}</h3><div class="sym">${c[1]}</div></div><div class="msg">奉哪一款茶？</div><div class="grid g2">${cs.o.map(x=>`<button class="dr" onclick="pickT('${x[0]}')">${x[0]}<div class="cn">${x[1]}</div></button>`).join("")}</div>`}
function pickT(n){if(n!==cs.t[0]){S.rep=Math.max(0,S.rep-1);S.coin-=10;K[cs.t[0]]=1;use();$("app").innerHTML=hdr()+`<div class="card"><h3>上错茶</h3><p class="sym">你上的是「${n}」（${tf(n)[1]}，${tf(n)[2]}，香气${tf(n)[3]}）。<br>客人要的是「${cs.t[0]}」：${cs.t[1]}，产自${cs.t[2]}，香气${cs.t[3]}，正对客人的描述。<br>📜 ${TD[cs.t[0]][1]}<br>名望 -1，铜钱 -10。</p></div><button class="btn" onclick="hub()">回前堂</button>`;return}
const hint=K[n]?`（茶典：约 ${cs.t[4]}℃）`:"（还没学过这款，凭经验猜）";
$("app").innerHTML=hdr()+`<div class="card"><h3>${n} · 冲泡</h3><p class="sym" style="text-align:center">第一步：选水温 ℃<br><span class="cn" style="color:#26331f">${hint}</span></p></div><div class="grid">${[75,80,85,90,95,100].map(x=>`<button class="dr" onclick="brew(${x})">${x}℃</button>`).join("")}</div>`}
function brew(tp){cs.tp=tp;const s=cs.t[5],hint=K[cs.t[0]];
$("app").innerHTML=hdr()+`<div class="card"><h3>第二步 · 出汤</h3><p class="sym" style="text-align:center">看茶汤颜色，觉得够了就按「出汤」<br><span class="cn" style="color:#26331f">${hint?"金色区为恰好时间":"（没学过，没有刻度提示）"}</span></p><div class="bigbar"><i id="fl" style="width:0"></i>${hint?`<em style="left:${(s*.8/60*100).toFixed(1)}%;width:${(s*.4/60*100).toFixed(1)}%"></em>`:""}</div><div class="cn" style="color:#26331f;text-align:center" id="tt">0 秒</div></div><button class="btn" onclick="pour()">出汤</button>`;
cs.t0=performance.now();stopL();const lp=()=>{const t=Math.min(60,(performance.now()-cs.t0)/100);$("fl").style.width=t/60*100+"%";$("tt").textContent=Math.round(t)+" 秒";if(t>=60)return pour();raf=requestAnimationFrame(lp)};lp()}
function pour(){stopL();const t=Math.min(60,(performance.now()-cs.t0)/100),s=cs.t[5],td=Math.abs(cs.tp-cs.t[4]),sd=Math.abs(t-s)/s;
const a=td===0?2:td<=5?1:0,b=sd<=.2?2:sd<=.4?1:0,pt=a+b;K[cs.t[0]]=1;use();
const g=[5,15,25,35,50][pt],r=pt===4?3:pt>=3?2:pt>=2?1:0;S.coin+=g;S.rep+=r;
$("app").innerHTML=hdr()+`<div class="card"><h3>${["难以入口","勉强可饮","尚可","清香宜人","一杯绝品"][pt]}</h3><p class="sym" style="text-align:center">水温 ${cs.tp}℃（宜 ${cs.t[4]}℃）${td?cs.tp>cs.t[4]?"：偏高，易烫熟嫩叶、味苦涩":"：偏低，香气不易散发、味淡":"：刚好"}<br>出汤 ${Math.round(t)} 秒（宜约 ${s} 秒）${sd>.2?t<s?"：出汤偏早，味淡":"：泡太久，苦涩":"：恰到好处"}<br>🍵 ${TD[cs.t[0]][2]}<br>💡 ${TD[cs.t[0]][3]}<br>铜钱 +${g}，名望 +${r}</p></div><button class="btn" onclick="hub()">回前堂</button>`}
/* quizzes */
function tq(){cs={n:0,ok:0};tq1()}
function tq1(){const t=R(T);cs.t=t;const o=sh([t,...sh(T.filter(x=>x!==t)).slice(0,5)]);
$("app").innerHTML=hdr()+`<div class="card"><h3>识茶 ${cs.n+1}/3</h3><p class="sym" style="text-align:center">${t[2]}出产<br>香气：${t[3]}<br>属于${t[1]}</p></div><div class="msg">是哪一款？</div><div class="grid">${o.map(x=>`<button class="dr" onclick="tA('${x[0]}')">${x[0]}</button>`).join("")}</div>`}
function tA(n){K[cs.t[0]]=1;const ok=n===cs.t[0],t=cs.t,w=tf(n);if(ok)cs.ok++;cs.n++;
fb(ok,(ok?"":`你选了「${n}」：${w[1]}，产自${w[2]}，香气${w[3]}。<br>`)+`正确答案是「${t[0]}」：${t[1]}，产自${t[2]}，香气${t[3]}。<br>📜 ${TD[t[0]][1]}`,"识茶")}
function fb(ok,h,nm){$("app").innerHTML=hdr()+`<div class="card"><h3 style="color:${ok?"#2d7a3a":"#9a3b24"}">${ok?"✔ 答对了":"✘ 答错了"}</h3><p class="sym">${h}</p></div><button class="btn" onclick="${cs.n<3?(nm==="识茶"?"tq1()":"cq1()"):"fin('"+nm+"')"}">${cs.n<3?"下一题":"完成"}</button>`}
function cq(){cs={n:0,ok:0};cq1()}
function cq1(){const t=R(T);cs.t=t;$("app").innerHTML=hdr()+`<div class="card"><h3>茶经 ${cs.n+1}/3</h3><p class="sym" style="text-align:center">「${t[0]}」属于哪一类茶？</p></div><div class="grid">${CAT.map(x=>`<button class="dr" onclick="cA('${x}')">${x}</button>`).join("")}</div>`}
function cA(c){K[cs.t[0]]=1;const t=cs.t,ok=c===t[1];if(ok)cs.ok++;cs.n++;
fb(ok,(ok?"":`你选了「${c}」：${CD[c]}。<br>`)+`「${t[0]}」是${t[1]}：${CD[t[1]]}。<br>产自${t[2]}，香气${t[3]}。<br>📜 ${TD[t[0]][1]}`,"茶经")}
function fin(n){use();const g=cs.ok*6;S.coin+=g;if(cs.ok===3)S.rep++;$("app").innerHTML=hdr()+`<div class="card"><h3>${n}完毕</h3><p class="sym" style="text-align:center">答对 ${cs.ok}/3<br>铜钱 +${g}${cs.ok===3?"，名望 +1":""}</p></div><button class="btn" onclick="hub()">回前堂</button>`}
/* dict */
function dict(){stopL();$("app").innerHTML=hdr()+`<div class="card"><h3>茶典 ${nK()}/${T.length}</h3><div class="cn" style="text-align:center;color:#26331f">点茶名查看；待客、识茶时遇到的茶会自动记入</div></div><div class="grid">${T.map(t=>`<button class="dr" style="${K[t[0]]?"":"opacity:.5"}" onclick="dd('${t[0]}')">${t[0]}</button>`).join("")}</div><button class="btn alt" onclick="hub()">回前堂</button>`}
function dd(n){K[n]=1;save();const t=tf(n),d=TD[n];$("app").innerHTML=hdr()+`<div class="card"><h3>${n}</h3><p class="sym">类别：${t[1]}<br>产地：${t[2]}<br>香气：${t[3]}<br>水温：约 ${t[4]}℃<br>出汤：约 ${t[5]} 秒（首泡）<br>特点：${t[6]}<br>🍃 工艺：${d[0]}<br>📜 典故：${d[1]}<br>🍵 汤色滋味：${d[2]}<br>💡 冲泡小贴士：${d[3]}</p></div><button class="btn" onclick="dict()">返回茶典</button>`}
document.addEventListener("click",()=>save());window.addEventListener("pagehide",save);
const baseHub=hub;
function missionState(){const mo=S.mo||1;if(!S.mission||S.mission.mo!==mo)S.mission={mo,rep:S.rep,day:S.day,claimed:false};return S.mission}
function claimMission(){const m=missionState();if(m.claimed||S.rep-m.rep<5||S.day-m.day<3)return;m.claimed=true;S.coin+=60;save();hub()}
function buyEnergy(){if(S.coin<20||S.hp>=10)return;S.coin-=20;S.hp=Math.min(10,S.hp+3);save();hub()}
hub=function(){baseHub();if(S.day>S.max)return;const m=missionState();const box=document.createElement('div');box.className='card';box.style.marginTop='12px';const title=document.createElement('h3');title.textContent="本月任务";const desc=document.createElement('p');desc.className='sym';desc.textContent=`提升名望5点并度过3天。名望 ${Math.max(0,Math.min(5,S.rep-m.rep))}/5 · 天数 ${Math.max(0,Math.min(3,S.day-m.day))}/3`;const bt=document.createElement('button');bt.className='btn';bt.textContent=m.claimed?"奖励已领取":"领取60铜钱";bt.disabled=m.claimed||S.rep-m.rep<5||S.day-m.day<3;bt.onclick=claimMission;const energy=document.createElement('button');energy.className='btn alt';energy.textContent="补充体力 · 20铜钱（+3体力）";energy.disabled=S.coin<20||S.hp>=10;energy.onclick=buyEnergy;box.append(title,desc,bt,energy);$('app').append(box);save()};
hub();
</script></body></html>
